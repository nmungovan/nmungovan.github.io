name: Deploy

on:
  push:
    branches: [main]
  # Allows redeploying from the Actions tab without a new commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancel it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Yarn 4 is pinned via `packageManager`; Corepack provides it
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --immutable

      # Don't publish a broken main
      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Type-checks with tsc, then builds with Vite into build/
      - name: Build
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
