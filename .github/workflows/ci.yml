name: CI

# Pull requests only: merges to main are checked again by deploy.yml, which
# runs the same lint/test/build before publishing.
on:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Yarn 4 is pinned via `packageManager`; Corepack provides it
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Type-checks with tsc, then builds with Vite
      - name: Build
        run: yarn build
